# Deliberately trimmed for a 3-day sprint: ruff only.
# No mypy hook - the type-check round trip is not worth the sprint time here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # 1000, not 500: the submission deck ships in the repo so the
        # GitHub link is a complete submission on its own.
        args: [--maxkb=1000]
